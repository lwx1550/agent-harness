[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-harness"
version = "0.1.0"
description = "A lightweight, programmable CLI coding agent harness"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
]

[project.scripts]
harness = "harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.hatch.build.targets.sdist]
include = ["src/harness/**"]

